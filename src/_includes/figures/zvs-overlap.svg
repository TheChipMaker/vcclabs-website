<svg viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hard switching versus zero voltage switching waveforms" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <g fill="none" stroke-width="2" stroke-linecap="square">

    <text x="0" y="16" class="svg-label">HARD SWITCHING</text>
    <line x1="60" y1="120" x2="700" y2="120" class="svg-axis"/>
    <line x1="60" y1="30" x2="60" y2="120" class="svg-axis"/>
    <text x="0" y="44" class="svg-tick">Vds</text>
    <text x="0" y="116" class="svg-tick">0</text>

    <polyline points="60,40 300,40 340,120 700,120" class="svg-trace"/>
    <polyline points="60,120 300,120 320,44 360,44 380,120 700,120" class="svg-trace-alt"/>
    <polygon points="300,40 340,120 300,120" class="svg-overlap"/>
    <text x="352" y="86" class="svg-callout">overlap = loss</text>

    <line x1="300" y1="140" x2="300" y2="152" class="svg-axis"/>
    <polyline points="60,176 300,176 300,152 460,152 460,176 700,176" class="svg-gate"/>
    <text x="0" y="172" class="svg-tick">Gate</text>

    <line x1="0" y1="206" x2="720" y2="206" class="svg-rule"/>

    <text x="0" y="238" class="svg-label">ZERO VOLTAGE SWITCHING</text>
    <line x1="60" y1="316" x2="700" y2="316" class="svg-axis"/>
    <line x1="60" y1="252" x2="60" y2="316" class="svg-axis"/>
    <text x="0" y="264" class="svg-tick">Vds</text>
    <text x="0" y="312" class="svg-tick">0</text>

    <polyline points="60,258 260,258 330,316 700,316" class="svg-trace"/>
    <polyline points="60,316 330,316 350,268 400,268 420,316 700,316" class="svg-trace-alt"/>

    <line x1="260" y1="326" x2="260" y2="338" class="svg-dim"/>
    <line x1="330" y1="326" x2="330" y2="338" class="svg-dim"/>
    <line x1="260" y1="332" x2="330" y2="332" class="svg-dim"/>
    <text x="342" y="336" class="svg-callout">dead time: Vds reaches 0 before the gate rises</text>

  </g>
</svg>
